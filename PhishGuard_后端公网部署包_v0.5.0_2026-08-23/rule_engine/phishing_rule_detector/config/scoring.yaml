# 评分与等级门控配置
schema_version: "2.1.0"
rule_version: "3.0.0"
updated_at: "2026-08-11"

# 等级分数区间
level_thresholds:
  low_max: 29
  medium_max: 59
  high_max: 79
  critical_min: 80

# 等级区间用于 clamp
level_ranges:
  low: [0, 29]
  medium: [30, 59]
  high: [60, 79]
  critical: [80, 100]

# 展示分 clamp 使用的下限
level_floor_scores:
  low: 0
  medium: 30
  high: 60
  critical: 80

# 合格证据的 decision_confidence 阈值
qualifying_thresholds:
  medium: 0.75
  high: 0.80

# 同组衰减系数
group_attenuation:
  - 1.0    # 第一条 100%
  - 0.5    # 第二条 50%
  - 0.25   # 第三条及以后 25%

# 证据组分值上限
group_score_caps:
  identity: 35
  credential: 40
  navigation: 25
  social: 20
  transport: 15
  payload: 30

# raw_score 上限
max_raw_score: 100
